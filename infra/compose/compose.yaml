name: engineering-accreditation

services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../../apps/api
    environment:
      EA_ENVIRONMENT: development
      EA_DATABASE_URL: postgresql+asyncpg://accreditation:accreditation@postgres:5432/accreditation
      EA_REDIS_URL: redis://redis:6379/0
      EA_OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      EA_CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/live')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  worker-document:
    build:
      context: ../../apps/worker
    command:
      [
        "celery",
        "--app=worker_app.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=document",
        "--hostname=document@%h",
      ]
    environment:
      EA_CELERY_BROKER_URL: redis://redis:6379/0
      EA_CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  worker-ai:
    build:
      context: ../../apps/worker
    command:
      [
        "celery",
        "--app=worker_app.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=ai",
        "--hostname=ai@%h",
      ]
    environment:
      EA_CELERY_BROKER_URL: redis://redis:6379/0
      EA_CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: accreditation
      POSTGRES_USER: accreditation
      POSTGRES_PASSWORD: accreditation
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accreditation -d accreditation"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: local-development
      MINIO_ROOT_PASSWORD: local-development-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-storage-data:/data

volumes:
  postgres-data:
  redis-data:
  object-storage-data:
