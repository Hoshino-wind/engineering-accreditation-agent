[project]
name = "engineering-accreditation-worker"
version = "0.1.0"
description = "工程认证智能体异步任务服务"
requires-python = ">=3.13"
dependencies = [
  "celery[redis]>=5.6.3,<6",
  "pydantic-settings>=2.14.2,<3",
]

[project.optional-dependencies]
dev = [
  "celery-types>=0.26.0,<1",
  "mypy>=1.17.0,<2",
  "pytest>=8.4.0,<10",
  "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
