[project]
name = "engineering-accreditation-api"
version = "0.1.0"
description = "工程认证智能体 API 服务"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30.0,<1",
  "boto3>=1.35.0,<2",
  "fastapi>=0.140.7,<0.141",
  "httpx>=0.27.0,<1",
  "langgraph>=0.2,<1",
  "passlib[bcrypt]>=1.7.4,<2",
  "pyjwt>=2.10.1,<3",
  "pydantic-settings>=2.14.2,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35.0,<1",
  "python-multipart>=0.0.32",
  "pymupdf>=1.28.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9.1,<3",
  "mypy>=1.17.0,<2",
  "pytest>=8.4.0,<10",
  "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
