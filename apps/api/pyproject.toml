[project]
name = "engineering-accreditation-api"
version = "0.1.0"
description = "工程认证智能体 API 服务"
requires-python = ">=3.13"
dependencies = [
  "asyncpg>=0.30.0,<1",
  "fastapi>=0.140.7,<0.141",
  "httpx>=0.28.1,<1",
  "pymupdf>=1.26.0,<2",
  "pypdf>=6.0.0,<7",
  "pydantic-settings>=2.14.2,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9.1,<3",
  "mypy>=1.17.0,<2",
  "pytest>=8.4.0,<10",
  "ruff>=0.12.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
